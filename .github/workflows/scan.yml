name: Amazon reviews scan

on:
  schedule:
    # Provisional: GitHub arranca los cron con horas de retraso. Lo sustituirá una rutina de
    # Claude que lanza el workflow a las 05:00 UTC y luego importa y refresca el dashboard.
    - cron: '17 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Paginar hasta max_pages aunque aparezcan reseñas ya conocidas (carga inicial)'
        type: boolean
        default: false
      max_pages:
        description: 'Máximo de páginas por ASIN y marketplace (Amazon no da más de 10)'
        default: '3'
      only_asins:
        description: 'Solo estos ASIN, separados por comas (vacío = todos). Para pruebas.'
        default: ''

permissions:
  contents: write

concurrency:
  group: reviews-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Amazon reviews via OpenWeb Ninja
        env:
          OPENWEBNINJA_KEY: ${{ secrets.OPENWEBNINJA_KEY }}
          # Cookie de una cuenta de COMPRADOR (nunca la de Seller Central) con sesión iniciada
          # en cada Amazon. Formato: "session-id=...; ubid-acbXX=...; x-acbXX=...; at-acbXX=..."
          # Sin cookie en un marketplace, solo se obtienen las ~8 reseñas destacadas.
          AMAZON_COOKIE_ES: ${{ secrets.AMAZON_COOKIE_ES }}
          AMAZON_COOKIE_DE: ${{ secrets.AMAZON_COOKIE_DE }}
          AMAZON_COOKIE_FR: ${{ secrets.AMAZON_COOKIE_FR }}
          AMAZON_COOKIE_IT: ${{ secrets.AMAZON_COOKIE_IT }}
          AMAZON_COOKIE_UK: ${{ secrets.AMAZON_COOKIE_UK }}
          AMAZON_COOKIE_NL: ${{ secrets.AMAZON_COOKIE_NL }}
          AMAZON_COOKIE_BE: ${{ secrets.AMAZON_COOKIE_BE }}
          AMAZON_COOKIE_PL: ${{ secrets.AMAZON_COOKIE_PL }}
          AMAZON_COOKIE_SE: ${{ secrets.AMAZON_COOKIE_SE }}
          AMAZON_COOKIE_IE: ${{ secrets.AMAZON_COOKIE_IE }}
          BACKFILL: ${{ inputs.backfill }}
          MAX_PAGES: ${{ inputs.max_pages }}
          ONLY_ASINS: ${{ inputs.only_asins }}
        run: python3 scripts/scan.py

      - name: Commit results
        run: |
          git config user.name "vulkkano-amazon-reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Actualiza reseñas de Amazon $(date -u +%F)"
          git push

      # Va después del commit para no perder lo que sí se descargó. Un run en rojo hace que
      # GitHub mande email: así nos enteramos de cuota agotada o cookies caducadas.
      - name: Fail if there were errors
        run: |
          n=$(jq '.errors | length' data/scan-status.json)
          if [ "$n" -gt 0 ]; then
            echo "::error::$n errores en el scan (ver resumen)"; jq -r '.errors[]' data/scan-status.json; exit 1
          fi
